<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome — The Daily Signal</title>
    <meta name="description" content="Welcome to The Daily Signal. Configure your AI keys.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .welcome-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        .welcome-card {
            max-width: 500px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
        }
        .welcome-card h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-card p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .key-form {
            text-align: left;
        }
        .key-form .input-group {
            margin-bottom: 1.5rem;
        }
        .key-form label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        .key-form input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .key-form input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 15px rgba(255,255,255,0.05);
        }
        .btn-start {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 1rem;
        }
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }
        .key-help {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            display: block;
        }
        .key-help a {
            color: #fff;
            text-decoration: underline;
            opacity: 0.8;
        }
        .key-help a:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <div class="welcome-container">
        <div class="panel glass welcome-card">
            <div class="logo-pulse" style="margin: 0 auto 1.5rem auto;"></div>
            <h1>The Daily Signal</h1>
            <p>Welcome to the autonomous AI radio show pipeline. Please enter your API keys to get started.</p>
            
            <form class="key-form" id="welcomeForm">
                <div class="input-group">
                    <label for="geminiKey">Gemini API Key</label>
                    <input type="password" id="geminiKey" placeholder="AIzaSy..." required>
                    <span class="key-help">Required for AI generation and TTS. <a href="https://aistudio.google.com/app/apikey" target="_blank">Get one here</a>.</span>
                </div>
                
                <div class="input-group">
                    <label for="serperKey">Serper API Key</label>
                    <input type="password" id="serperKey" placeholder="Optional for web search...">
                    <span class="key-help">Required for "The Scout" news search. <a href="https://serper.dev/" target="_blank">Get one here</a>.</span>
                </div>

                <button type="submit" class="btn-start">Launch Dashboard</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Pre-fill if keys exist
            const existingGemini = localStorage.getItem('gemini_key');
            const existingSerper = localStorage.getItem('serper_key');
            
            if (existingGemini) document.getElementById('geminiKey').value = existingGemini;
            if (existingSerper) document.getElementById('serperKey').value = existingSerper;

            document.getElementById('welcomeForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const geminiKey = document.getElementById('geminiKey').value.trim();
                const serperKey = document.getElementById('serperKey').value.trim();
                
                if (geminiKey) {
                    localStorage.setItem('gemini_key', geminiKey);
                    localStorage.setItem('serper_key', serperKey);
                    window.location.href = '/';
                }
            });
        });
    </script>
</body>
</html>
